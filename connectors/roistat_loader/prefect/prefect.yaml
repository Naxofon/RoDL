prefect-version: "3.4.22"
project:
  name: loader-dashboard
deployments:
  - name: roistat-loader-clickhouse
    entrypoint: connectors/roistat_loader/prefect/flows.py:roistat_loader_flow
    schedule:
      cron: "0 8 * * *"
      timezone: Asia/Novosibirsk
    work_pool:
      name: default-agent-pool
      work_queue_name: default
    tags:
      - roistat
    parameters:
      tdelta: 10
